name: Makefile CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@main

    - name: Check Makefile syntax
      run: make -n all

    - name: Install shellcheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck

    - name: Run shellcheck on shell scripts
      run: shellcheck *.sh

    - name: make all
      run:
        set -euo pipefail
        echo 'Running install as root to loosely simulate termux environment...'
        echo 'first without previous version'
        sudo make -j"$(nproc)" all
        echo 'now with previous version'
        echo 'test' > ~/bin/termux-url-opener
        sudo make -j"$(nproc)" all
        ls -l ~/bin
        cat ~/bin/termux-url-opener~
        test "$(cat ~/bin/termux-url-opener~)" = test && echo passed
