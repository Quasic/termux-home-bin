name: Makefile CI

on:
  push:
    branches: [ "master", "wip" ]
  pull_request:
    branches: [ "master", "wip" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@main

    - name: Check Makefile syntax
      run: make -n all

    - name: Install shellcheck
      run: sudo apt-get update&&sudo apt-get install -y shellcheck

    - name: Run shellcheck on shell scripts
      run: shellcheck *.sh

    - name: Check prj.sh
      run: bash prj.sh --version

    - name: dummy pkg
      run: sudo ln /usr/bin/true /usr/bin/pkg

    - name: run install script directly
      run: sudo HOME="$HOME" sh ./install.sh && ls -l ~/bin
      
    - name: check ~/bin/termux-url-opener installation
      run: sudo cmp ~/bin/termux-url-opener termux-url-opener

    - name: check ~/bin/termux-file-editor installation
      run: sudo test ~/bin/termux-file-editor -ef ~/bin/termux-url-opener

    - name: setup for backup test
      run: sudo HOME="$HOME" bash -c 'echo testUO > "$HOME/bin/termux-url-opener" && rm "$HOME/bin/termux-file-editor" && echo testFE > "$HOME/bin/termux-file-editor"' && ls -l "$HOME/bin"
        
    - name: make all
      run: PREFIX=/usr sudo HOME="$HOME" make all

    - name: check duckduckgo installation
      run: test -x /usr/bin/duckduckgo && cmp /usr/bin/duckduckgo duckduckgo.sh

    - name: check prj installation
      run: test -x /usr/bin/prj && cmp /usr/bin/prj prj.sh

    - name: check ~/bin/termux-url-opener installation
      run: cmp ~/bin/termux-url-opener termux-url-opener

    - name: check ~/bin/termux-file-editor installation
      run: test ~/bin/termux-file-editor -ef ~/bin/termux-url-opener

    - name: check ~/bin/termux-url-opener~ backup
      run: cmp "$HOME/bin/termux-url-opener~" <(echo testUO)

    - name: check ~/bin/termux-file-editor~ backup
      run: cmp ~/bin/termux-file-editor~ <(echo testFE)

    - name: setup passthrough termux-url-opener for duckduckgo.sh test
      run: sudo bash -c 'mkdir -p /data/data/com.termux/files/home/bin&&printf "#!/bin/sh\nprintf %%s \"\$1\"" >/data/data/com.termux/files/home/bin/termux-url-opener&& chmod +x /data/data/com.termux/files/home/bin/termux-url-opener'

    - name: check passthrough termux-url-opener
      run: cat /data/data/com.termux/files/home/bin/termux-url-opener
        
    - name: test duckduckgo.sh
      run: dash duckduckgo.sh 'test search & quack' | grep -q 'https://duckduckgo.com/?q=test+search+%26+quack'
        
