name: Makefile CI

on:
  push:
    branches: [ "master", "wip" ]
  pull_request:
    branches: [ "master", "wip" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@main

    - name: Check Makefile syntax
      run: make -n all

    - name: Install shellcheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck

    - name: Run shellcheck on shell scripts
      run: shellcheck *.sh

    - name: make all
      run:
        set -euo pipefail
        echo "Running install as root to loosely simulate termux environment..."
        sudo HOME="$HOME" make -j"$(nproc)" all

    - name: check if ~/bin/termux-url-opener exists
      run:
        test -e "$HOME/bin/termux-url-opener"

    - name: setup to make again
      run:
        echo test > ~/bin/termux-url-opener
        
    - name: run install script directly
      run:
        set -euo pipefail
        echo 'Running again to check backup function'
        sudo HOME="$HOME" sh ./install.sh
      
    - name: check if ~/bin/termux-url-opener~ exists
      run:
        test -e "$HOME/bin/termux-url-opener~"
